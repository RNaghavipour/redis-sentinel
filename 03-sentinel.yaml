---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-svc
  namespace: redis
spec:
  type: ClusterIP
  selector:
    app: sentinel
  ports:
  - name: sentinel
    port: 26379
    targetPort: 26379
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dp
  namespace: redis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel
  minReadySeconds: 5
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sentinel
    spec:
      serviceAccountName: redis-sa
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sentinel
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: init-sentinel-config
        image: busybox:1.37.0-glibc
        command:
        - sh
        - -c
        - cp /tmp/raw-config.conf /config/sentinel.conf
        volumeMounts:
        - name: sentinel-config-org
          mountPath: /tmp/raw-config.conf
          subPath: sentinel.conf
        - name: sentinel-config
          mountPath: /config
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      containers:
      - name: sentinel
        image: redis:7.4.1
        ports:
        - name: sentinel
          containerPort: 26379
          protocol: TCP
        command: ["redis-server", "/etc/sentinel/sentinel.conf", "--sentinel"]
        volumeMounts:
        - name: sentinel-config
          mountPath: /etc/sentinel
        resources:
          limits:
            cpu: 30m
            memory: 50Mi
        readinessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -p 26379 ping"]
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: sentinel-config-org
        configMap:
          name: redis-cm
      - name: sentinel-config
        emptyDir: {}
